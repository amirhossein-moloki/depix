services:
  nginx:
    image: nginx:alpine
    container_name: depix-gateway
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api
    networks:
      - depix-network

  postgres:
    image: postgres:16-alpine
    container_name: crmerp-postgres
    environment:
      POSTGRES_DB: crm_erp_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - depix-network

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crmerp-api
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=crm_erp_db;Username=postgres;Password=postgrespassword
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - depix-network

networks:
  depix-network:
    driver: bridge

volumes:
  postgres_data:

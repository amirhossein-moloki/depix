services:
  nginx:
    image: nginx:alpine
    container_name: depix-gateway
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
      integration:
        condition: service_started
    networks:
      - depix-network

  postgres:
    image: postgres:16-alpine
    container_name: crmerp-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-crm_erp_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - depix-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crmerp-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB:-crm_erp_db};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}
      - MEDUSA_INTERNAL_URL=${MEDUSA_INTERNAL_URL:-http://medusa:9000}
      - PAYLOAD_INTERNAL_URL=${PAYLOAD_INTERNAL_URL:-http://payload:3000}
      - INTEGRATION_INTERNAL_URL=${INTEGRATION_INTERNAL_URL:-http://integration:3001}
      - INTEGRATION_INTERNAL_API_KEY=${INTEGRATION_INTERNAL_API_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - depix-network

  frontend:
    image: nginx:alpine
    container_name: depix-frontend
    command: sh -c "echo '<html><body><h1>Depix Frontend Application</h1></body></html>' > /usr/share/nginx/html/index.html && sed -i 's/listen       80;/listen       3000;/' /etc/nginx/conf.d/default.conf && nginx -g 'daemon off;'"
    networks:
      - depix-network

  integration:
    build:
      context: ./infrastructure/integration
      dockerfile: Dockerfile
    container_name: depix-integration
    environment:
      - PORT=3001
      - MEDUSA_INTERNAL_URL=${MEDUSA_INTERNAL_URL:-http://medusa:9000}
      - PAYLOAD_INTERNAL_URL=${PAYLOAD_INTERNAL_URL:-http://payload:3000}
      - INTEGRATION_INTERNAL_API_KEY=${INTEGRATION_INTERNAL_API_KEY}
    networks:
      - depix-network

networks:
  depix-network:
    driver: bridge

volumes:
  postgres_data:

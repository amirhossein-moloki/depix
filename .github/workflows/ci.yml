name: CI Pipeline

on:
  push:
    branches: [ main, master, 'feature/*' ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore CrmErp.sln

    - name: Build solution
      run: dotnet build CrmErp.sln --no-restore --configuration Release

    - name: Run Architecture & Unit Tests
      run: dotnet test CrmErp.sln --no-build --configuration Release --verbosity normal

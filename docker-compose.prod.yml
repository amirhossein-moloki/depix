services:
  nginx:
    image: nginx:alpine
    container_name: crmerp-prod-nginx
    restart: unless-stopped
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d:/etc/nginx/conf.d:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - /var/www/dedpix/docker/nginx/acme-challenge:/var/www/html:ro
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    networks:
      - crmerp-prod-network

  postgres:
    image: postgres:16-alpine
    container_name: crmerp-prod-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - crmerp-prod-network

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: crmerp-prod-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__Database=Host=postgres;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}
      - Jwt__Secret=${JWT_SECRET}
      - Jwt__Issuer=${JWT_ISSUER}
      - Jwt__Audience=${JWT_AUDIENCE}
      - Jwt__AccessTokenExpirationMinutes=${JWT_ACCESS_EXPIRATION_MINUTES:-60}
      - Jwt__RefreshTokenExpirationDays=${JWT_REFRESH_EXPIRATION_DAYS:-7}
      - Cors__AllowedOrigins__0=${CORS_ALLOWED_ORIGIN:-https://depix.ir}
      - Cors__AllowedOrigins__1=${CORS_ALLOWED_ORIGIN_WWW:-https://www.depix.ir}
      - OPENAPI_ENABLED=${OPENAPI_ENABLED:-true}
      - LOG_DIR=/app/logs
      - FileStorage__BasePath=/app/uploads
    volumes:
      - uploads_prod_data:/app/uploads
      - logs_prod_data:/app/logs
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - crmerp-prod-network

  frontend:
    image: node:20-alpine
    container_name: crmerp-prod-frontend
    restart: unless-stopped
    working_dir: /app
    volumes:
      - /var/www/dedpix:/app
    command: sh -c "if [ -f package.json ]; then npm start -- -p 3000; else echo 'Frontend source not found' && exit 1; fi"
    networks:
      - crmerp-prod-network

networks:
  crmerp-prod-network:
    driver: bridge

volumes:
  postgres_prod_data:
  uploads_prod_data:
  logs_prod_data:

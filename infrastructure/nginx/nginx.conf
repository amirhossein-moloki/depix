worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    upstream crmerp_host {
        server api:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Unified OpenAPI / Swagger Surface
        location /api/docs {
            proxy_pass http://crmerp_host/api/docs;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        location /swagger/ {
            proxy_pass http://crmerp_host/swagger/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /api/openapi.json {
            proxy_pass http://crmerp_host/api/openapi.json;
            proxy_set_header Host $host;
        }

        # Global Health Endpoint
        location /api/v1/health {
            proxy_pass http://crmerp_host/api/v1/health;
            proxy_set_header Host $host;
        }

        # Core CRM / ERP Monolith Endpoints
        location / {
            proxy_pass http://crmerp_host/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

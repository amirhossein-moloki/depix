worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    # Safe log format excluding token/auth details
    log_format safe_combined '$remote_addr - $remote_user [$time_local] '
                             '"$request" $status $body_bytes_sent '
                             '"$http_referer" "$http_user_agent" '
                             'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log safe_combined;
    error_log /var/log/nginx/error.log warn;

    # Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Upstream Definitions
    upstream backend_server {
        server backend:5000;
    }

    upstream frontend_server {
        server frontend:3000;
    }

    upstream medusa_backend {
        server medusa:9000;
    }

    upstream payload_backend {
        server payload:3000;
    }

    upstream integration_service {
        server integration:3001;
    }

    include /etc/nginx/conf.d/*.conf;
}

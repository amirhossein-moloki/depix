# HTTP Server Block - ACME Challenge & HTTPS Redirect
server {
    listen 80;
    server_name depix.ir www.depix.ir;

    # ACME Challenge location for Let's Encrypt / Certbot
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Redirect all other HTTP traffic to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS Server Block - Production Applications
server {
    listen 443 ssl;
    server_name depix.ir www.depix.ir;

    # SSL Certificate Configuration
    ssl_certificate /etc/letsencrypt/live/depix.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/depix.ir/privkey.pem;

    # SSL/TLS Protocols & Security Settings
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # ACME Challenge Location on HTTPS
    location /.well-known/acme-challenge/ {
        root /var/www/html;
        try_files $uri =404;
    }

    # Frontend Application Root
    location / {
        proxy_pass http://frontend_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Frontend Static Caching Optimization
    location /_next/static/ {
        proxy_pass http://frontend_server/_next/static/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ASP.NET Core Backend Reverse Proxy Routing
    location /back-end/ {
        proxy_pass http://backend_server/;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /back-end {
        return 301 /back-end/;
    }

    # Backend Health Check Routing
    location /health {
        proxy_pass http://backend_server/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Swagger / OpenAPI Routing
    location /swagger/ {
        proxy_pass http://backend_server/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /swagger {
        return 301 /swagger/;
    }

    location /api/docs {
        proxy_pass http://backend_server/swagger/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
    }

    location /api/openapi.json {
        proxy_pass http://backend_server/swagger/v1/swagger.json;
        proxy_set_header Host $host;
    }

    location /api/v1/health {
        proxy_pass http://backend_server/api/v1/health;
        proxy_set_header Host $host;
    }
}
